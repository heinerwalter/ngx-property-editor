<div class="handle">
  <fa-icon [icon]="iconCaretUp" class="handle-up" (click)="onClick('up')"></fa-icon>
  <fa-icon [icon]="iconCaretDown" class="handle-down" (click)="onClick('down')"></fa-icon>
  <fa-icon [icon]="iconCaretLeft" class="handle-left" (click)="onClick('left')"></fa-icon>
  <fa-icon [icon]="iconCaretRight" class="handle-right" (click)="onClick('right')"></fa-icon>
</div>
