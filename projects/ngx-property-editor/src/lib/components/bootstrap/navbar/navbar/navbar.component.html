<header class="header">
  <div class="container">

    <ng-container *ngIf="!hideNavbarItems">

      <ul class="nav">

        <li class="nav-item nav-item-logo" *ngIf="logoImageUrl">
          <ng-container *ngIf="homeItem?.routerLink">
            <a class="nav-link m-0 p-0"
               id="navbar-app-logo"
               [routerLink]="homeItem!.routerLink"
               [ngbTooltip]="homeItem!.title">
              <img [src]="logoImageUrl"
                   alt="Logo"
                   class="app-logo"/>
            </a>
          </ng-container>
          <ng-container *ngIf="!homeItem?.routerLink">
            <img [src]="logoImageUrl"
                 alt="Logo"
                 class="app-logo"/>
          </ng-container>
        </li>

        <ng-container *ngIf="homeItem && homeItemMode !== 'logo-only'">
          <pe-navbar-item [item]="homeItem"
                          mode="icon-or-text"
                          class="nav-link-home">
          </pe-navbar-item>
        </ng-container>

        <ng-container *ngFor="let item of items">
          <pe-navbar-item [item]="item"
                          mode="text">
          </pe-navbar-item>
        </ng-container>

      </ul>

      <!--<div class="text-end">
        <button ngb-btn buttonClass="btn-outline-light me-2">Login</button>
        <button ngb-btn buttonClass="btn-warning">Sign-up</button>
      </div>-->

    </ng-container>

  </div>
</header>
